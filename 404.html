<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14181C">
<title>STUB</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314181C'/%3E%3Ctext x='50' y='70' font-family='Roboto,sans-serif' font-size='58' font-weight='900' text-anchor='middle' fill='%2300E054'%3ES%3C/text%3E%3C/svg%3E">
<script>
  /* mesmo tema que a pessoa escolheu no site (chave "stub-theme"); senão, o do sistema */
  (function(){
    var t = null;
    try{ t = localStorage.getItem("stub-theme"); }catch(e){}
    if(t !== "light" && t !== "dark") t = (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F5F6;
    --text:#14181C;
    --text-dim:rgba(20,24,28,0.62);
    --ticket:#00A843;
    --ticket-ink:#06140C;
    --ticket-ink-soft:rgba(6,20,12,0.62);
    --shadow:rgba(20,24,28,0.18);
    --btn-ghost:rgba(20,24,28,0.08);
    --focus:#14181C;
    color-scheme:light;
  }
  html[data-theme="dark"]{
    --bg:#14181C;
    --text:#E7EBEE;
    --text-dim:rgba(231,235,238,0.62);
    --ticket:#00E054;
    --ticket-ink:#08140D;
    --ticket-ink-soft:rgba(8,20,13,0.6);
    --shadow:rgba(0,0,0,0.55);
    --btn-ghost:rgba(255,255,255,0.08);
    --focus:#E7EBEE;
    color-scheme:dark;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{ height:100%; }
  body{
    background:var(--bg); color:var(--text);
    font-family:'Roboto', system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:max(32px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom));
  }
  main{ width:100%; max-width:420px; text-align:center; position:relative; z-index:1; }

  /* imagem de apoio: fica atrás do ingresso, encostada no canto, sem roubar a atenção */
  .jogadora{
    position:fixed; right:0; bottom:0;
    width:min(44vw, 250px); height:auto;
    opacity:0.8;
    z-index:0; pointer-events:none; user-select:none;
    -webkit-mask-image:linear-gradient(180deg, #000 62%, transparent 100%);
    mask-image:linear-gradient(180deg, #000 62%, transparent 100%);
  }
  @media (max-width:420px){ .jogadora{ width:42vw; } }
  /* tela baixa (teclado aberto, paisagem no celular): a imagem sai de cena */
  @media (max-height:520px){ .jogadora{ display:none; } }

  /* ---------- o ingresso rasgado (o único elemento chamativo da página) ---------- */
  .ticket-wrap{ margin:0 auto 44px; width:min(340px, 100%); filter:drop-shadow(0 18px 28px var(--shadow)); }
  .ticket{
    position:relative; display:flex; height:150px;
    background:var(--ticket); color:var(--ticket-ink);
    border-radius:14px 0 0 14px;
    transform:rotate(-4deg);
    /* borda direita rasgada */
    clip-path:polygon(0 0, 95% 0, 99% 7%, 94.5% 14%, 100% 21%, 95.5% 29%, 99% 36%, 94% 44%, 100% 51%, 95% 58%, 98.5% 66%, 94.5% 73%, 100% 80%, 95.5% 88%, 98.5% 94%, 95% 100%, 0 100%);
  }
  /* recortes redondos da picotagem, em cima e embaixo */
  .ticket::before, .ticket::after{
    content:""; position:absolute; left:calc(28% - 11px); width:22px; height:22px; border-radius:50%; background:var(--bg);
  }
  .ticket::before{ top:-11px; }
  .ticket::after{ bottom:-11px; }
  .stub{
    width:28%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    border-right:2px dashed var(--ticket-ink-soft);
  }
  .stub span{
    transform:rotate(-90deg); font-weight:900; font-size:26px; letter-spacing:0.04em; white-space:nowrap;
  }
  .admit{
    flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    padding:0 30px 0 20px; text-align:left;
  }
  .admit .kicker{ font-size:14px; font-weight:500; color:var(--ticket-ink-soft); }
  .admit .big{ font-size:62px; font-weight:900; line-height:0.95; letter-spacing:-0.035em; margin-top:2px; }
  .admit .big.word{ font-size:33px; letter-spacing:-0.02em; white-space:nowrap; }

  /* ---------- texto ---------- */
  h1{ font-size:26px; font-weight:700; line-height:1.2; letter-spacing:-0.01em; }
  p{ font-size:16px; line-height:1.55; color:var(--text-dim); margin:12px auto 0; max-width:34ch; }
  .actions{ display:flex; flex-direction:column; gap:10px; margin-top:28px; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    min-height:48px; padding:0 22px; border-radius:10px; border:none; cursor:pointer;
    font:inherit; font-size:15px; font-weight:700; text-decoration:none;
  }
  .btn.primary{ background:var(--ticket); color:var(--ticket-ink); }
  .btn.ghost{ background:var(--btn-ghost); color:var(--text); font-weight:500; }
  .btn:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; }
  .btn[disabled]{ opacity:0.6; cursor:default; }
  .status{ font-size:14px; color:var(--text-dim); margin-top:16px; min-height:1.4em; }
  [hidden]{ display:none !important; }

  /* um único movimento: o ingresso cai no lugar quando a página abre */
  @media (prefers-reduced-motion: no-preference){
    .ticket{ animation:drop .7s cubic-bezier(.2,.9,.25,1.15) both; }
    @keyframes drop{
      from{ opacity:0; transform:translateY(-36px) rotate(6deg); }
      to{ opacity:1; transform:translateY(0) rotate(-4deg); }
    }
  }
  @media (max-width:360px){
    .ticket{ height:132px; }
    .admit .big{ font-size:52px; }
    .admit .big.word{ font-size:28px; }
    h1{ font-size:23px; }
  }
</style>
</head>

    var t = {
      notfound:    { kicker: "Sala", big: "404", word: false, title: "Essa página não existe",
                     desc: "O link pode estar errado ou a página foi removida.", retry: false },
      maintenance: { kicker: "Sessão em", big: "Intervalo", word: true, title: "O STUB está em manutenção",
                     desc: "Estamos fazendo ajustes e voltamos em instantes. Esta página confere sozinha e te leva de volta quando o site estiver no ar.", retry: true },
      offline:     { kicker: "Você está", big: "Sem sinal", word: true, title: "Sem conexão com a internet",
                     desc: "Conecte-se e o STUB abre de novo automaticamente.", retry: true }
    }[m];
    el("tKicker").textContent = t.kicker;
    el("tBig").textContent = t.big;
    el("tBig").classList.toggle("word", t.word);
    el("title").textContent = t.title;
    el("desc").textContent = t.desc;
    document.title = t.title + " · STUB";
    el("btnHome").hidden = t.retry;
    el("btnRetry").hidden = !t.retry;
    if(t.retry) startChecking(); else stopChecking();
  }

  /* o site voltou? — index.html responde e NÃO está marcado como em manutenção */
  function siteIsBack(){
    /* offline a raiz não pôde ser descoberta; descobre agora, antes de conferir */
    var ready = baseKnown ? Promise.resolve(base) : detectBase().then(function(b){ base = b; baseKnown = true; el("btnHome").setAttribute("href", base); return b; });
    return ready.then(function(){ return fetch(base + "index.html?v=" + Date.now(), { cache: "no-store" }); })
      .then(function(r){ return r.ok ? r.text() : ""; })
      .then(function(html){ return !!html && !/STUB_MAINTENANCE\s*=\s*true/.test(html); })
      .catch(function(){ return false; });
  }

  function check(){
    el("btnRetry").disabled = true;
    el("status").textContent = "Verificando…";
    return siteIsBack().then(function(back){
      el("btnRetry").disabled = false;
      if(back){
        el("status").textContent = "O STUB voltou. Abrindo…";
        location.replace(base);
        return;
      }
      countdown = RETRY_SECONDS;
      tick();
    });
  }

  function tick(){
    if(countdown <= 0){ check(); return; }
    el("status").textContent = mode === "offline" && !navigator.onLine
      ? "Aguardando a conexão voltar."
      : "Nova verificação em " + countdown + " s.";
    countdown--;
    timer = setTimeout(tick, 1000);
  }

  function startChecking(){ stopChecking(); countdown = RETRY_SECONDS; tick(); }
  function stopChecking(){ if(timer){ clearTimeout(timer); timer = null; } el("status").textContent = ""; }

  el("btnRetry").addEventListener("click", function(){ stopChecking(); check(); });
  window.addEventListener("online", function(){ if(mode !== "notfound"){ stopChecking(); check(); } });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && mode !== "notfound"){ stopChecking(); check(); } });

  var forced = /[?&]m=1\b/.test(location.search);
  if(!navigator.onLine){ setMode("offline"); return; }
  if(forced){ setMode("maintenance"); }
  detectBase().then(function(b){
    base = b; baseKnown = true;
    el("btnHome").setAttribute("href", base);
    if(forced || isRootPath()) setMode("maintenance");
    else setMode("notfound");
  });
})();
</script>
</body>
</html>
